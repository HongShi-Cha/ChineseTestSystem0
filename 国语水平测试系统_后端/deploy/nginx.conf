# ============================================================
# 国语水平测试系统 - nginx 站点配置模板（第 10 步）
#
# 安装位置：/etc/nginx/conf.d/guoyu.conf
# 需要改的地方（全文只有这三处）：
#   1. server_name        -> 你的域名
#   2. ssl_certificate*   -> 你的证书路径
#   3. 全局 limit_req_zone 要放在 http { } 块里（见文件末尾说明）
#
# 分工：nginx 负责 HTTPS、限流、上传大小限制；uvicorn 只处理 /api/**，
# 并且监听 127.0.0.1，不直接对外暴露，任何人都绕不过 nginx。
# ============================================================

# ---------- 限流区（必须放在 http {} 块里）----------
# 登录接口：同一 IP 每分钟 20 次，防暴力破解（应用层还有账号锁定兜底）
limit_req_zone $binary_remote_addr zone=guoyu_login:10m rate=20r/m;
# 其它接口：同一 IP 每秒 10 次
limit_req_zone $binary_remote_addr zone=guoyu_api:10m rate=10r/s;
# 上传接口：同一 IP 每秒 2 次（录音上传很占带宽）
limit_req_zone $binary_remote_addr zone=guoyu_upload:10m rate=2r/s;

upstream guoyu_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name guoyu.example.com;

    # 证书续期校验走这里
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name guoyu.example.com;

    ssl_certificate     /etc/letsencrypt/live/guoyu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guoyu.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- 安全响应头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ---------- 上传限制 ----------
    # 后端自己的上限是 20MB（MAX_UPLOAD_BYTES），这里给到 25MB 留余量。
    # 更早地在 nginx 层挡掉超大请求，能省掉一次到后端的内存/磁盘开销。
    client_max_body_size 25m;
    client_body_timeout 120s;

    # ---------- 转发给后端 ----------
    # 这些 proxy_set_header 写在 server 块里，下面所有 location 都会继承。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # 注意用 $proxy_add_x_forwarded_for（追加），不要用 $http_x_forwarded_for：
    # 后者会把客户端伪造的值原样传下去，限流就形同虚设。
    # uvicorn 取的是最后一个值，也就是 nginx 追加的真实 IP。
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 120s;   # 讯飞评测最长可能要 60s，留足余量

    # 后端之外的路径一律 404：避免有人把后端目录放到前端目录里导致源码可下载
    location ^~ /国语水平测试系统_后端/ { return 404; }
    location ~ /\.(?!well-known)        { deny all; }

    # ---------- 登录接口 ----------
    location = /api/auth/login {
        limit_req zone=guoyu_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://guoyu_backend;
    }

    # ---------- 录音上传 ----------
    location = /api/exam/submit {
        limit_req zone=guoyu_upload burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://guoyu_backend;
        proxy_request_buffering off;   # 边收边转，别先落盘再转发
    }

    # ---------- 其它接口（含前端静态页，一并发给 FastAPI） ----------
    location / {
        limit_req zone=guoyu_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://guoyu_backend;
    }
}

# ============================================================
# 可选优化：让 nginx 直接发前端静态文件（吞吐更高，但要小心目录暴露）
#
#   把上面 location / 改成：
#       root /srv/guoyu/frontend;
#       location /assets/  { expires 30d; add_header Cache-Control "public, max-age=2592000"; }
#       location ~* \.(css|js)$ { expires 7d; add_header Cache-Control "public, max-age=604800"; }
#       location /api/ { limit_req zone=guoyu_api burst=60 nodelay; proxy_pass http://guoyu_backend; }
#       location / { try_files $uri $uri/ =404; }
#
#   前提：前端目录和后端目录是**平级**的（/srv/guoyu/frontend 与 /srv/guoyu/backend），
#   千万别把后端目录放进前端目录里，否则 .env 和数据库密码会被直接下载。
# ============================================================