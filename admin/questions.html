<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- Backend connected: 已对接 Python(FastAPI) + MySQL 后端，数据来自 /api/**，字段为 Python 下划线命名。纯前端无后端演示版备份见 js/main.mock.js。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>题库管理 - 国语水平测试系统</title>
  <link href="../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="admin-questions">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="dashboard.html"><i class="bi bi-mortarboard-fill me-2"></i>国语水平测试系统 · 管理端</a>
      <div class="d-flex align-items-center gap-2">
        <span class="text-white small d-none d-md-inline"><i class="bi bi-person-circle me-1"></i>管理员</span>
        <a class="btn btn-sm btn-outline-light" href="#" data-action="logout"><i class="bi bi-box-arrow-right me-1"></i>退出</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-0">
    <div class="row g-0">
      <!-- 左侧菜单 -->
      <div class="col-lg-2 col-md-3 d-none d-md-block">
        <div class="sidebar p-3">
          <div class="sidebar-title mb-3 fw-semibold">功 能 菜 单</div>
          <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i>控制台</a>
            <a class="nav-link active" href="questions.html"><i class="bi bi-journal-text"></i>题库管理</a>
            <a class="nav-link" href="students.html"><i class="bi bi-people"></i>学生成绩管理</a>
          </nav>
          <hr class="border-light opacity-25 my-3">
          <nav class="nav flex-column">
            <a class="nav-link" href="../index.html"><i class="bi bi-house"></i>入口页</a>
          </nav>
        </div>
      </div>

      <!-- 右侧内容区 -->
      <div class="col-lg-10 col-md-9 px-4 py-4">
        <h5 class="fw-bold mb-3"><i class="bi bi-journal-text me-2 text-primary-custom"></i>题库管理</h5>

        <div class="card mb-3">
          <div class="card-body d-flex flex-wrap gap-2 align-items-center">
            <button class="btn btn-primary" id="btnAddQuestion"><i class="bi bi-plus-lg me-1"></i>新增题目</button>
            <label class="btn btn-outline-primary mb-0">
              <i class="bi bi-file-earmark-excel me-1"></i><span id="uploadLabel">上传题库 Excel</span>
              <input type="file" id="questionExcel" accept=".xlsx,.xls" class="d-none">
            </label>
            <div class="ms-auto d-flex gap-2">
              <select class="form-select form-select-sm" id="qTypeFilter" style="width: 130px;">
                <option value="">全部题型</option>
                <option value="1">读单字</option>
                <option value="2">读词语</option>
                <option value="3">朗读短文</option>
                <option value="4">命题说话</option>
              </select>
              <div class="input-group input-group-sm" style="width: 230px;">
                <input type="text" class="form-control" id="questionSearch" placeholder="搜索内容 / 拼音答案">
                <button class="btn btn-outline-primary" type="button" id="btnSearchQuestion"><i class="bi bi-search"></i></button>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr><th style="width:70px">编号</th><th style="width:110px">题型</th><th>题目内容</th><th style="width:26%">拼音 / 答案</th><th style="width:90px">难度</th><th style="width:150px">更新时间</th><th style="width:110px">操作</th></tr>
              </thead>
              <tbody id="questionTbody"></tbody>
            </table>
          </div>
          <div class="card-body border-top d-flex flex-wrap justify-content-between align-items-center gap-2 py-3">
            <span class="text-secondary small" id="questionPageInfo"></span>
            <nav>
              <ul class="pagination pagination-sm mb-0" id="questionPageNav"></ul>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 新增 / 编辑题目弹窗 -->
  <div class="modal fade" id="questionModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formQuestion">
          <div class="modal-header bg-primary-custom text-white">
            <h6 class="modal-title"><i class="bi bi-journal-plus me-2"></i><span id="questionModalTitle">新增题目</span></h6>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="questionId" value="">
            <div class="mb-3">
              <label class="form-label">题型</label>
              <select class="form-select" id="qType">
                <option value="1">一、读单音节字词</option>
                <option value="2">二、读多音节词语</option>
                <option value="3">三、朗读短文</option>
                <option value="4">四、命题说话</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">题目内容</label>
              <textarea class="form-control" id="qContent" rows="3" placeholder="一个字 / 一个词 / 一篇短文 / 一个话题"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">拼音 / 答案</label>
              <textarea class="form-control" id="qAnswer" rows="2" placeholder="输入对应拼音或参考答案（可留空）"></textarea>
            </div>
            <div class="mb-1">
              <label class="form-label">难度</label>
              <select class="form-select" id="qLevel">
                <option>简单</option>
                <option>中等</option>
                <option>困难</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" id="btnSaveQuestion" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>保存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
