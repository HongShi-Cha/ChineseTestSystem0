<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- Backend connected: 已对接 Python(FastAPI) + MySQL 后端，数据来自 /api/**，字段为 Python 下划线命名。纯前端无后端演示版备份见 js/main.mock.js。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 国语水平测试系统</title>
  <link href="../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="admin-dashboard">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="dashboard.html"><i class="bi bi-mortarboard-fill me-2"></i>国语水平测试系统 · 管理端</a>
      <div class="d-flex align-items-center gap-2">
        <span class="text-white small d-none d-md-inline"><i class="bi bi-person-circle me-1"></i>管理员</span>
        <a class="btn btn-sm btn-outline-light" href="#" data-action="logout"><i class="bi bi-box-arrow-right me-1"></i>退出</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-0">
    <div class="row g-0">
      <!-- 左侧菜单 -->
      <div class="col-lg-2 col-md-3 d-none d-md-block">
        <div class="sidebar p-3">
          <div class="sidebar-title mb-3 fw-semibold">功 能 菜 单</div>
          <nav class="nav flex-column">
            <a class="nav-link active" href="dashboard.html"><i class="bi bi-speedometer2"></i>控制台</a>
            <a class="nav-link" href="questions.html"><i class="bi bi-journal-text"></i>题库管理</a>
            <a class="nav-link" href="students.html"><i class="bi bi-people"></i>学生成绩管理</a>
          </nav>
          <hr class="border-light opacity-25 my-3">
          <nav class="nav flex-column">
            <a class="nav-link" href="../index.html"><i class="bi bi-house"></i>入口页</a>
          </nav>
        </div>
      </div>

      <!-- 右侧内容区 -->
      <div class="col-lg-10 col-md-9 px-4 py-4">
        <h5 class="fw-bold mb-3"><i class="bi bi-speedometer2 me-2 text-primary-custom"></i>控制台</h5>

        <div class="row g-3 mb-4">
          <div class="col-6 col-xl-3">
            <div class="card"><div class="card-body d-flex align-items-center gap-3">
              <div class="stat-icon bg-primary-custom text-white"><i class="bi bi-people"></i></div>
              <div><div class="text-secondary small">学生总数</div><div class="fs-4 fw-bold" id="statStudents">-</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card"><div class="card-body d-flex align-items-center gap-3">
              <div class="stat-icon bg-info text-white"><i class="bi bi-journal-text"></i></div>
              <div><div class="text-secondary small">题库题目</div><div class="fs-4 fw-bold" id="statQuestions">-</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card"><div class="card-body d-flex align-items-center gap-3">
              <div class="stat-icon bg-warning text-white"><i class="bi bi-calendar-check"></i></div>
              <div><div class="text-secondary small">今日考试人次</div><div class="fs-4 fw-bold" id="statToday">-</div></div>
            </div></div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="card"><div class="card-body d-flex align-items-center gap-3">
              <div class="stat-icon bg-success text-white"><i class="bi bi-graph-up-arrow"></i></div>
              <div><div class="text-secondary small">平均分</div><div class="fs-4 fw-bold text-success-score" id="statAvg">-</div></div>
            </div></div>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-lg-7">
            <div class="card h-100">
              <div class="card-header"><i class="bi bi-clock-history me-2"></i>最近考试动态</div>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead><tr><th>考生</th><th>班级</th><th>得分</th><th>等级</th><th>交卷时间</th></tr></thead>
                  <tbody id="recentTbody"></tbody>
                </table>
              </div>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="card h-100">
              <div class="card-header"><i class="bi bi-bar-chart me-2"></i>各题型平均得分率</div>
              <div class="card-body">
                <div id="typeScoreChart" style="height: 300px;"></div>
                <div id="typeChartEmpty" class="d-none text-center text-secondary small py-5">
                  <i class="bi bi-inbox fs-1"></i>
                  <p class="mt-2 mb-0">还没有考试数据</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../assets/vendor/echarts/echarts.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
