<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- Backend connected: 已对接 Python(FastAPI) + MySQL 后端，数据来自 /api/**，字段为 Python 下划线命名。纯前端无后端演示版备份见 js/main.mock.js。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成绩报告 - 国语水平测试系统</title>
  <link href="../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="report">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="dashboard.html"><i class="bi bi-mortarboard-fill me-2"></i>国语水平测试系统</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navReport">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navReport">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">我的考试</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html">历史成绩</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i><span data-user-name>同学</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item text-danger" href="#" data-action="logout"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <!-- 报告主体（有数据时显示） -->
    <div id="reportContent">
      <!-- 总分卡片 -->
      <div class="card border-0 bg-primary-custom text-white mb-4 text-center">
        <div class="card-body py-4">
          <div class="small opacity-75 mb-1">本次考试成绩</div>
          <div class="display-4 fw-bold"><span id="reportTotal">-</span> <span class="fs-4">分</span></div>
          <div class="mt-2">
            <span id="reportLevel" class="me-2"></span>
            <span id="reportStatus"></span>
          </div>
          <div class="small opacity-75 mt-2" id="reportUser"></div>
          <div class="small opacity-75 mt-1" id="reportMeta"></div>
        </div>
      </div>

      <!-- 四大题得分 -->
      <h5 class="fw-bold mb-3"><i class="bi bi-bar-chart me-2 text-primary-custom"></i>各题得分</h5>
      <div class="row g-3 mb-4" id="sectionCards"></div>

      <!-- 声韵调详情 -->
      <div class="card mb-4">
        <div class="card-header"><i class="bi bi-journal-check me-2"></i>声韵调详情报告</div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr><th>评测项目</th><th>声母得分率</th><th>韵母得分率</th><th>声调得分率</th></tr>
            </thead>
            <tbody id="detailTbody"></tbody>
          </table>
        </div>
      </div>

      <div class="d-grid d-md-flex gap-2 justify-content-md-center">
        <a href="dashboard.html" class="btn btn-primary btn-lg px-4"><i class="bi bi-house me-2"></i>返回首页</a>
        <a href="history.html" class="btn btn-outline-primary btn-lg px-4"><i class="bi bi-graph-up me-2"></i>查看历史成绩</a>
        <a href="exam.html" class="btn btn-outline-secondary btn-lg px-4"><i class="bi bi-arrow-repeat me-2"></i>再来一场</a>
      </div>
    </div>

    <!-- 空态提示（没有成绩时显示，由 main.js 填充并切换显隐） -->
    <div id="reportEmpty" class="d-none"></div>
  </main>

  <footer class="footer py-3 mt-4">
    <div class="container text-center">版权所有 © 2026 国语水平测试系统 V1.0</div>
  </footer>

  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
